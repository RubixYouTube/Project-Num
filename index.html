<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Num Remastered</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Decimal.js for BigNumber operations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
  <!-- Heroicons for clean icons -->
  <script src="https://unpkg.com/heroicons@2.0.18/dist/outline.js"></script>

  <script>
    // Create BigNum wrapper using Decimal
    window.BigNum = (function() {
      class BigNumWrapper {
        constructor(value) {
          this.value = new Decimal(value);
        }
        static pow(base, exp) {
          const b = base instanceof BigNumWrapper ? base.value : new Decimal(base);
          const e = exp instanceof BigNumWrapper ? exp.value : new Decimal(exp);
          return new BigNumWrapper(Decimal.pow(b, e));
        }
        plus(other) {
          return new BigNumWrapper(this.value.plus(other.value));
        }
        times(other) {
          return new BigNumWrapper(this.value.times(other.value));
        }
        gte(other) {
          return this.value.gte(other.value);
        }
        toFixed(digits) {
          return this.value.toFixed(digits);
        }
        toNumber() {
          return this.value.toNumber();
        }
        log10() {
          return new BigNumWrapper(this.value.log(10));
        }
        floor() {
          return new BigNumWrapper(this.value.floor());
        }
        div(other) {
          return new BigNumWrapper(this.value.div(other.value));
        }
      }
      return BigNumWrapper;
    })();
  </script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen">
  <!-- Header -->
  <header class="flex justify-between items-center p-4 border-b border-gray-700">
    <div class="flex items-center space-x-2">
      <svg class="h-8 w-8 text-yellow-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2v4c0 1.105 1.343 2 3 2s3-.895 3-2v-4c0-1.105-1.343-2-3-2z" />
      </svg>
      <h1 class="text-4xl font-bold">Project Num</h1>
    </div>
    <div class="flex items-center space-x-4">
      <button id="copyBtn" class="flex items-center px-3 py-1 border border-green-500 rounded hover:bg-green-600 transition">
        <i class="fas fa-copy text-green-400 mr-2"></i>
        Copy Value
      </button>
      <a href="#" class="text-blue-400 hover:underline">View on GitHub</a>
    </div>
  </header>

  <!-- Main Counter -->
  <main class="flex-grow flex items-center justify-center">
    <span id="number" class="text-9xl font-mono tracking-tight">0</span>
  </main>

  <!-- Footer -->
  <footer class="p-4 border-t border-gray-700 text-sm text-gray-400">
    <p>*May Expand Later</p>
    <p>Limit: 10^10^65536</p>
  </footer>

  <script>
    const LIMIT = BigNum.pow(10, BigNum.pow(10, 65536));

    let value = new BigNum(0);
    let increment = new BigNum(1);
    let expoGain = new BigNum(1.5);
    let expoAccel = new BigNum(1.5);

    let lastDOMUpdate = 0;
    const UPDATE_INTERVAL = 100; // ms
    const numberEl = document.getElementById('number');

    function formatValue(v) {
      if (v.gte(BigNum.pow(10, 6))) {
        const exp = v.log10().floor();
        const mant = v.div(BigNum.pow(10, exp)).toNumber().toFixed(2);
        return `${mant} × 10^${exp.toFixed(0)}`;
      }
      return v.toFixed(0);
    }

    function updateLogic() {
      if (value.gte(LIMIT)) {
        value = LIMIT;
        numberEl.textContent = '10^10^65536';
        cancelAnimationFrame(rafId);
        return;
      }
      value = value.plus(increment);
      increment = increment.times(expoGain);
      if (value.gte(new BigNum(1e6))) expoGain = expoGain.times(expoAccel);
    }

    function loop(ts) {
      updateLogic();
      if (ts - lastDOMUpdate > UPDATE_INTERVAL) {
        numberEl.textContent = formatValue(value);
        lastDOMUpdate = ts;
      }
      rafId = requestAnimationFrame(loop);
    }

    // Start animation
    let rafId = requestAnimationFrame(loop);

    // Copy button functionality
    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(numberEl.textContent)
        .then(() => alert('Value copied to clipboard!'))
        .catch(() => alert('Failed to copy.'));
    });
  </script>
</body>
</html>
